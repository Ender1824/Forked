<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forked</title>
  <meta name="description" content="Swipe on Upper Valley restaurants with your crew and find the one you all want.">
  <link rel="icon" href="/icon.png">
  <link rel="apple-touch-icon" href="/icon.png">
  <style>
    :root {
      --navy: #1a2136;
      --cream: #fdf9f2;
      --sand: #f5eee5;
      --blue: #5cbdff;
      --orange: #ff994a;
      --muted: #5d6475;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--navy);
      background:
        radial-gradient(420px 420px at 15% 8%, rgba(92, 189, 255, 0.28), transparent 70%),
        radial-gradient(420px 420px at 85% 12%, rgba(255, 153, 74, 0.28), transparent 70%),
        linear-gradient(var(--cream), var(--sand));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }
    main { max-width: 440px; width: 100%; text-align: center; }
    .icon { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 10px 30px rgba(26, 33, 54, 0.15); }
    h1 { font-size: 48px; font-weight: 900; margin: 20px 0 8px; letter-spacing: -0.5px; }
    .tagline { font-size: 19px; color: var(--muted); line-height: 1.45; margin: 0 0 28px; }
    .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 28px; }
    .step {
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid rgba(26, 33, 54, 0.06);
      border-radius: 18px;
      padding: 14px 8px;
      font-size: 14px;
      font-weight: 700;
    }
    .step span { display: block; font-size: 24px; margin-bottom: 6px; }
    .badge {
      display: inline-block;
      background: var(--orange);
      color: white;
      font-weight: 800;
      padding: 14px 28px;
      border-radius: 999px;
      text-decoration: none;
    }
    .note { color: var(--muted); font-size: 14px; margin-top: 14px; }
  </style>
</head>
<body>
  <main>
    <img class="icon" src="/icon.png" alt="Forked app icon">
    <h1>Forked</h1>
    <p class="tagline">Can't decide where to eat in the Upper Valley? Swipe on local spots with your crew and find the one you all want.</p>
    <div class="steps">
      <div class="step"><span>🔗</span>Share a link</div>
      <div class="step"><span>👆</span>Everyone swipes</div>
      <div class="step"><span>🧡</span>Eat where you match</div>
    </div>
    <span class="badge">Coming soon to the App Store</span>
    <p class="note">Lebanon · West Lebanon · Hanover · White River Junction</p>
  </main>
</body>
</html>
